<title>Вацок-генератор</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Lobster&family=PT+Sans:wght@400;700&display=swap">
<style>
  :root{
    --ground:#F2E9D8; --panel:#FFFBF2; --ink:#2A1A16; --muted:#7A6255;
    --maroon:#7A2420; --gold:#9A6E1E; --line:rgba(42,26,22,.18); --chip:#FFFBF2;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#160F0E; --panel:#241714; --ink:#F0E2C6; --muted:#AC9381;
      --maroon:#C9564B; --gold:#D4A24C; --line:rgba(240,226,198,.18); --chip:#241714;
    }
  }
  :root[data-theme="dark"]{
    --ground:#160F0E; --panel:#241714; --ink:#F0E2C6; --muted:#AC9381;
    --maroon:#C9564B; --gold:#D4A24C; --line:rgba(240,226,198,.18); --chip:#241714;
  }

  *{box-sizing:border-box}
  body{margin:0; background:var(--ground); color:var(--ink);
       font:400 16px/1.6 "PT Sans", system-ui, sans-serif}
  .wrap{max-width:600px; margin:0 auto; padding-block:0 56px; padding-left:18px; padding-right:18px}

  .strip{height:18px; margin:0 -18px 24px;
    background:
      repeating-linear-gradient(90deg, transparent 0 9px, rgba(0,0,0,.25) 9px 18px),
      repeating-linear-gradient(90deg, var(--maroon) 0 18px, var(--gold) 18px 36px)}

  h1{font:400 clamp(38px,10vw,56px)/1 Lobster, Georgia, serif; margin:0 0 12px;
     color:var(--maroon); text-wrap:balance}
  .lead{color:var(--muted); margin:0 0 24px; max-width:46ch}

  .eyebrow{font:700 12px/1 "PT Sans", sans-serif; letter-spacing:2.4px;
    text-transform:uppercase; color:var(--gold); margin:0 0 10px}

  .chips{display:flex; flex-wrap:wrap; gap:8px; margin:0 0 22px; padding:0; list-style:none}
  .chip{font:700 14px/1 "PT Sans", sans-serif; letter-spacing:.4px;
    background:var(--chip); color:var(--ink); border:1px solid var(--line);
    padding:11px 14px; border-radius:3px; cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--maroon); border-color:var(--maroon); color:#FFF7E8}

  figure{margin:0 0 14px}
  .shot{background:#0B0A12; border:1px solid var(--line); aspect-ratio:1/1; overflow:hidden}
  .shot img{display:block; width:100%; height:auto; max-width:100%}
  .fade{opacity:0; transition:opacity .3s ease}
  .fade.in{opacity:1}
  @media (prefers-reduced-motion: reduce){ .fade{transition:none} }
  figcaption{color:var(--muted); font-size:14px; margin-top:10px}

  .go{display:block; width:100%; font:400 26px/1 Lobster, Georgia, serif;
    color:#FFF7E8; background:var(--maroon); border:none; border-radius:3px;
    padding:18px; cursor:pointer; margin:0 0 14px}
  .go:active{transform:translateY(1px)}

  .tools{display:flex; gap:10px; flex-wrap:wrap; margin:0 0 22px}
  .btn{flex:1 1 150px; text-align:center; font:700 15px/1 "PT Sans", sans-serif;
    background:var(--panel); color:var(--ink); border:1px solid var(--line);
    border-radius:3px; padding:15px 14px; cursor:pointer}
  .vh{position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
  .vh:focus-visible + .btn{outline:3px solid var(--maroon); outline-offset:2px}

  .field{display:flex; flex-direction:column; gap:8px; margin:0 0 6px}
  label.lbl{font:700 12px/1 "PT Sans", sans-serif; letter-spacing:2.4px;
    text-transform:uppercase; color:var(--muted)}
  #own{font:400 17px "PT Sans", sans-serif; color:var(--ink); background:var(--panel);
    border:1px solid var(--line); border-radius:3px; padding:14px}
  .hint{color:var(--muted); font-size:14px; margin:6px 0 0}

  .chip:focus-visible, .go:focus-visible, #own:focus-visible, .btn:focus-visible{
    outline:3px solid var(--maroon); outline-offset:2px}

  footer{margin-top:36px; padding-top:18px; border-top:1px solid var(--line);
    color:var(--muted); font-size:13px; line-height:1.7}
</style>
