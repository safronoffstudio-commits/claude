# GRUB menu for the BroOS boot stick (works for both BIOS and UEFI).
# Boots straight into BroOS; press Esc (or hold Shift) during the
# first 2 seconds to see this menu.
set timeout=2
set timeout_style=hidden
set default=0

# The menu stays in text mode; the video mode is chosen per entry.
insmod all_video
insmod multiboot2

set menu_color_normal=light-gray/black
set menu_color_highlight=black/yellow

menuentry "BroOS 2.0" {
    multiboot2 /boot/broos.elf
    # UEFI: the screen's preferred (native) mode from its EDID, so wide
    # screens do not get a stretched 4:3 picture. BIOS: 1024x768.
    if [ "$grub_platform" = "efi" ]; then
        set gfxpayload=auto
    fi
    boot
}

submenu "Advanced options (if something does not work)" {
    # gfxpayload must be set after multiboot2: the loader overwrites it
    # with the mode requested in the kernel header.
    menuentry "BroOS - native screen resolution" {
        multiboot2 /boot/broos.elf
        set gfxpayload=auto
        boot
    }
    menuentry "BroOS - safe video 800x600" {
        multiboot2 /boot/broos.elf
        set gfxpayload=800x600x32,800x600
        boot
    }
    menuentry "BroOS - force own USB keyboard driver" {
        multiboot2 /boot/broos.elf usb
        boot
    }
    menuentry "BroOS - no own USB driver (firmware PS/2 emulation)" {
        multiboot2 /boot/broos.elf nousb
        boot
    }
    menuentry "BroOS - text mode (terminal only)" {
        multiboot2 /boot/broos.elf text
        boot
    }
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI firmware settings" {
        fwsetup
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
