# GRUB menu for the BroOS boot stick (works for both BIOS and UEFI).
set timeout=5
set timeout_style=menu
set default=0

insmod all_video
insmod gfxterm
insmod multiboot2

if loadfont unicode ; then
    set gfxmode=auto
    terminal_output gfxterm
fi

set menu_color_normal=light-gray/black
set menu_color_highlight=black/yellow

menuentry "BroOS 1.0" {
    multiboot2 /boot/broos.elf
    boot
}

submenu "Advanced options (if something does not work)" {
    # gfxpayload must be set after multiboot2: the loader overwrites it
    # with the mode requested in the kernel header.
    menuentry "BroOS - native screen resolution" {
        multiboot2 /boot/broos.elf
        set gfxpayload=keep
        boot
    }
    menuentry "BroOS - safe video 800x600" {
        multiboot2 /boot/broos.elf
        set gfxpayload=800x600x32,800x600
        boot
    }
    menuentry "BroOS - force own USB keyboard driver" {
        multiboot2 /boot/broos.elf usb
        boot
    }
    menuentry "BroOS - no own USB driver (firmware PS/2 emulation)" {
        multiboot2 /boot/broos.elf nousb
        boot
    }
}

if [ "$grub_platform" = "efi" ]; then
    menuentry "UEFI firmware settings" {
        fwsetup
    }
fi

menuentry "Reboot" {
    reboot
}

menuentry "Power off" {
    halt
}
